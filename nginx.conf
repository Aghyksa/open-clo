map "$status:$uri" $asset_cache_control {
    default "no-cache";
    ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Cache-Control $asset_cache_control always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression for maximum speed
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Static Assets caching (1 year immutable)
    location /assets/ {
        try_files $uri =404;
    }

    location /models/ {
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    # Healthcheck endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
