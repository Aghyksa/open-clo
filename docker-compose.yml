services:
  open-clo:
    image: ghcr.io/aghyksa/open-clo:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-clo-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8480:3001"
    environment:
      - NODE_ENV=production
      # Required: the server refuses to start without the public HTTPS origin (set it in .env).
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env, e.g. https://design.example.com}
    volumes:
      - openclo-data:/data

volumes:
  openclo-data:
