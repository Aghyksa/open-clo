services:
  open-clo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-clo-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8480:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
